<main>
  <div class="client-dashboard">
    <div class="sidebar">
      <div class="item selected" id="meus-dados">
        <img src="/assets/icons/user.svg" alt="user" />
        <span>Meus Dados</span>
      </div>
      <div class="item" id="viagens">
        <img src="/assets/icons/calendar-check.svg" alt="calendar-check" />
        <span>Viagens</span>
      </div>
      <div class="item" id="pagamentos">
        <img src="/assets/icons/credit-card.svg" alt="credit-card" />
        <span>Pagamentos</span>
      </div>
    </div>
    <div class="content">
      <div class="meus-dados selected">
        <h1>Meus Dados</h1>
        <form action="">
          <div class="dados-pessoais">
            <h3>
              <img
                src="/assets/icons/user-round-pen.svg"
                alt="user-round-pen"
              />Dados Pessoais
            </h3>
            <div class="form-group">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" />
            </div>
            <div class="form-group">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" name="cpf" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" />
            </div>
            <div class="form-group">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" />
            </div>
          </div>

          <div class="endereco">
            <h3>
              <img
                src="/assets/icons/map-pin-house.svg"
                alt="map-pin-house"
              />Endereço
            </h3>
            <div class="form-group">
              <label for="cep">CEP</label>
              <input type="text" id="cep" name="cep" />
            </div>
            <div class="form-group">
              <label for="rua">Rua</label>
              <input type="text" id="rua" name="rua" />
            </div>
            <div class="form-group">
              <label for="numero">Número</label>
              <input type="text" id="numero" name="numero" />
            </div>
            <div class="form-group">
              <label for="bairro">Bairro</label>
              <input type="text" id="bairro" name="bairro" />
            </div>
            <div class="form-group">
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade" />
            </div>
            <div class="form-group">
              <label for="estado">Estado</label>
              <input type="text" id="estado" name="estado" />
            </div>
          </div>
        </form>
        <div class="buttons">
          <button type="button" class="reset">REDEFINIR</button>
          <button type="button" class="save" disabled>SALVAR</button>
        </div>
      </div>
      <div class="viagens">
        <h1>Viagens</h1>
        <div class="trips"></div>
      </div>
      <div class="pagamentos">
        <h1>Pagamentos</h1>
        <div class="payments"></div>
      </div>
    </div>
  </div>
</main>
