<main class="cadastro-page">
  <div class="cadastro-card">
    <div class="cadastro-title">
      <h1>Criar uma conta</h1>
      <p>Preencha seus dados para começar</p>
    </div>

    <form id="cadastro-form" novalidate>
      <div class="form-group">
        <label>Eu sou</label>
        <div class="papel-toggle">
          <label class="papel-option">
            <input type="radio" name="papel" value="CLIENTE" checked />
            <span>Hóspede</span>
          </label>
          <label class="papel-option">
            <input type="radio" name="papel" value="ANFITRIAO" />
            <span>Anfitrião</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" />
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" />
        </div>
      </div>

      <div class="form-group">
        <label for="emailLogin">E-mail</label>
        <input type="email" id="emailLogin" name="emailLogin" placeholder="seu@email.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="password-wrapper">
          <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="new-password" />
          <button type="button" id="toggle-password">Mostrar</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" placeholder="00000-000" />
        </div>

        <div class="form-group">
          <label for="numero">Número</label>
          <input type="text" id="numero" name="numero" placeholder="0" />
        </div>
      </div>

      <div class="form-group">
        <label for="rua">Rua</label>
        <input type="text" id="rua" name="rua" placeholder="Nome da rua" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" placeholder="Bairro" />
        </div>

        <div class="form-group">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Cidade" />
        </div>

        <div class="form-group">
          <label for="estado">UF</label>
          <input type="text" id="estado" name="estado" placeholder="BA" maxlength="2" />
        </div>
      </div>

      <button type="submit" class="btn-cadastrar">Criar conta</button>
    </form>

    <div class="cadastro-divider"><span>ou</span></div>

    <button class="btn-login-link link" data-page="login">Já tenho uma conta</button>
  </div>
</main>
