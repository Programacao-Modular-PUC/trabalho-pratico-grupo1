<main>
  <div class="hospede-dashboard">

    <div class="sidebar">
      <div class="item selected" id="meu-perfil">
        <img src="/assets/icons/user-round-pen.svg" alt="" />
        <span>Meu Perfil</span>
      </div>
      <div class="item" id="meus-quartos">
        <img src="/assets/icons/map-pin-house.svg" alt="" />
        <span>Meus Quartos</span>
      </div>
      <div class="item" id="reservas">
        <img src="/assets/icons/calendar-check.svg" alt="" />
        <span>Reservas</span>
      </div>
      <div class="item" id="pagamentos">
        <img src="/assets/icons/credit-card.svg" alt="" />
        <span>Pagamentos</span>
      </div>
    </div>

    <div class="content">

      <div class="meu-perfil selected">
        <h1>Meu Perfil</h1>

        <div class="host-card">
          <div class="host-avatar" id="host-avatar"></div>
          <div class="host-info">
            <h2 id="host-nome-display"></h2>
            <span class="host-role">Anfitrião</span>
            <div class="host-meta">
              <span id="host-avaliacao"></span>
              <span class="meta-divider">·</span>
              <span id="host-quartos-count"></span>
              <span class="meta-divider">·</span>
              <span id="host-membro-desde"></span>
            </div>
          </div>
        </div>

        <form>
          <div class="dados-pessoais">
            <h3>
              <img src="/assets/icons/user-round-pen.svg" alt="" />
              Dados Pessoais
            </h3>
            <div class="form-group">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" />
            </div>
            <div class="form-group">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" name="cpf" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" />
            </div>
            <div class="form-group">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" />
            </div>
          </div>
          <div class="endereco">
            <h3>
              <img src="/assets/icons/map-pin-house.svg" alt="" />
              Endereço
            </h3>
            <div class="form-group">
              <label for="cep">CEP</label>
              <input type="text" id="cep" name="cep" />
            </div>
            <div class="form-group">
              <label for="rua">Rua</label>
              <input type="text" id="rua" name="rua" />
            </div>
            <div class="form-group">
              <label for="numero">Número</label>
              <input type="text" id="numero" name="numero" />
            </div>
            <div class="form-group">
              <label for="bairro">Bairro</label>
              <input type="text" id="bairro" name="bairro" />
            </div>
            <div class="form-group">
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade" />
            </div>
            <div class="form-group">
              <label for="estado">Estado</label>
              <input type="text" id="estado" name="estado" />
            </div>
          </div>
        </form>

        <div class="buttons">
          <button type="button" class="reset">REDEFINIR</button>
          <button type="button" class="save" disabled>SALVAR</button>
        </div>
      </div>

      <div class="meus-quartos">
        <div class="quartos-header">
          <h1>Meus Quartos</h1>
          <button class="btn-add" id="btn-add-quarto">+ Adicionar Quarto</button>
        </div>
        <div class="quartos-list"></div>
      </div>

      <div class="reservas">
        <h1>Reservas</h1>
        <div class="reservas-list"></div>
      </div>

      <div class="pagamentos">
        <h1>Pagamentos</h1>
        <div class="pagamentos-list"></div>
      </div>

    </div>
  </div>
</main>
